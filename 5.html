<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>만석공원 · 5번 지점</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green-dark: #1a3a2a;
      --green-light:#52b788;
      --sand:       #f5f0e8;
      --text:       #1a2318;
      --muted:      #6b7c69;
    }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--sand);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--green-dark);
      color: #fff;
      padding: 20px 24px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .badge {
      background: var(--green-light);
      color: var(--green-dark);
      font-size: 28px;
      font-weight: 700;
      width: 56px; height: 56px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    header h1 { font-size: 18px; font-weight: 700; line-height: 1.3; }
    header p  { font-size: 13px; color: #a8d5b5; margin-top: 3px; }
    main {
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }
    .location-card {
      background: #fff;
      border-radius: 14px;
      padding: 22px 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      text-align: center;
    }
    .location-card .pin { font-size: 40px; margin-bottom: 12px; }
    .location-card h2 {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.6;
      margin-bottom: 10px;
    }
    .location-card .sub {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 14px;
    }
    .warning {
      font-size: 13px;
      font-weight: 700;
      color: #cc0000;
      line-height: 1.6;
    }
    .emergency-wrap {
      background: #fff1f1;
      border: 2px solid #ff4444;
      border-radius: 14px;
      padding: 18px;
    }
    .emergency-wrap h2 {
      font-size: 14px;
      font-weight: 700;
      color: #cc0000;
      margin-bottom: 12px;
      text-align: center;
    }
    .emergency-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .emergency-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 18px 10px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 22px;
    }
    .emergency-btn span { font-size: 30px; }
    .emergency-btn small { font-size: 12px; font-weight: 400; }
    .btn-112 { background: #003399; color: #fff; }
    .btn-119 { background: #cc0000; color: #fff; }
    .btn-112:active { background: #002266; }
    .btn-119:active { background: #990000; }
    footer {
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="badge">5</div>
    <div>
      <h1>만석공원</h1>
      <p>긴급신고 안내 시스템</p>
    </div>
  </header>
  <main>
    <div class="location-card">
      <div class="pin">📍</div>
      <h2>현재 위치는 만석공원로 5 입니다.</h2>
      <p class="sub">연결 원하시는 버튼을 눌러 주세요.</p>
      <p class="warning">※ 허위 신고시 법적 제재를 받을 수 있습니다.</p>
    </div>
    <div class="emergency-wrap">
      <h2>🚨 긴급 신고</h2>
      <div class="emergency-row">
        <a href="tel:112" class="emergency-btn btn-112">
          <span>🚔</span>
          112
          <small>경찰 신고</small>
        </a>
        <a href="tel:119" class="emergency-btn btn-119">
          <span>🚑</span>
          119
          <small>응급 · 화재</small>
        </a>
      </div>
    </div>
  </main>
  <footer>만석공원 스마트 안내 시스템</footer>
</body>
</html>
